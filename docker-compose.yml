version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    env_file: ./backend/.env
    depends_on:
      - redis
    restart: always
    labels:
      - "traefik.enable=true"
      
      # HTTPS - aliceinteligence.com (Single L)
      - "traefik.http.routers.alice-api-single.rule=Host(`aliceinteligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-single.entrypoints=websecure"
      - "traefik.http.routers.alice-api-single.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-api-single.service=alice-api"

      # HTTPS - www.aliceinteligence.com (Single L WWW)
      - "traefik.http.routers.alice-api-single-www.rule=Host(`www.aliceinteligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-single-www.entrypoints=websecure"
      - "traefik.http.routers.alice-api-single-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-api-single-www.service=alice-api"

      # HTTPS - aliceintelligence.com (Double L)
      - "traefik.http.routers.alice-api-double.rule=Host(`aliceintelligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-double.entrypoints=websecure"
      - "traefik.http.routers.alice-api-double.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-api-double.service=alice-api"

      # HTTPS - www.aliceintelligence.com (Double L WWW)
      - "traefik.http.routers.alice-api-double-www.rule=Host(`www.aliceintelligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-double-www.entrypoints=websecure"
      - "traefik.http.routers.alice-api-double-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-api-double-www.service=alice-api"

      # Global API Service Port Definition
      - "traefik.http.services.alice-api.loadbalancer.server.port=3000"

      # HTTP Redirect to HTTPS - Single L
      - "traefik.http.routers.alice-api-single-http.rule=Host(`aliceinteligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-single-http.entrypoints=web"
      - "traefik.http.routers.alice-api-single-http.middlewares=redirect-to-https@docker"

      # HTTP Redirect to HTTPS - Single L WWW
      - "traefik.http.routers.alice-api-single-www-http.rule=Host(`www.aliceinteligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-single-www-http.entrypoints=web"
      - "traefik.http.routers.alice-api-single-www-http.middlewares=redirect-to-https@docker"

      # HTTP Redirect to HTTPS - Double L
      - "traefik.http.routers.alice-api-double-http.rule=Host(`aliceintelligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-double-http.entrypoints=web"
      - "traefik.http.routers.alice-api-double-http.middlewares=redirect-to-https@docker"

      # HTTP Redirect to HTTPS - Double L WWW
      - "traefik.http.routers.alice-api-double-www-http.rule=Host(`www.aliceintelligence.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-double-www-http.entrypoints=web"
      - "traefik.http.routers.alice-api-double-www-http.middlewares=redirect-to-https@docker"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: always
    labels:
      - "traefik.enable=true"

      # HTTPS - aliceinteligence.com (Single L)
      - "traefik.http.routers.alice-frontend-single.rule=Host(`aliceinteligence.com`)"
      - "traefik.http.routers.alice-frontend-single.entrypoints=websecure"
      - "traefik.http.routers.alice-frontend-single.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-frontend-single.service=alice-frontend"

      # HTTPS - www.aliceinteligence.com (Single L WWW)
      - "traefik.http.routers.alice-frontend-single-www.rule=Host(`www.aliceinteligence.com`)"
      - "traefik.http.routers.alice-frontend-single-www.entrypoints=websecure"
      - "traefik.http.routers.alice-frontend-single-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-frontend-single-www.service=alice-frontend"

      # HTTPS - aliceintelligence.com (Double L)
      - "traefik.http.routers.alice-frontend-double.rule=Host(`aliceintelligence.com`)"
      - "traefik.http.routers.alice-frontend-double.entrypoints=websecure"
      - "traefik.http.routers.alice-frontend-double.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-frontend-double.service=alice-frontend"

      # HTTPS - www.aliceintelligence.com (Double L WWW)
      - "traefik.http.routers.alice-frontend-double-www.rule=Host(`www.aliceintelligence.com`)"
      - "traefik.http.routers.alice-frontend-double-www.entrypoints=websecure"
      - "traefik.http.routers.alice-frontend-double-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-frontend-double-www.service=alice-frontend"

      # Global Frontend Service Port Definition
      - "traefik.http.services.alice-frontend.loadbalancer.server.port=80"

      # HTTP Redirect to HTTPS - Single L
      - "traefik.http.routers.alice-frontend-single-http.rule=Host(`aliceinteligence.com`)"
      - "traefik.http.routers.alice-frontend-single-http.entrypoints=web"
      - "traefik.http.routers.alice-frontend-single-http.middlewares=redirect-to-https@docker"

      # HTTP Redirect to HTTPS - Single L WWW
      - "traefik.http.routers.alice-frontend-single-www-http.rule=Host(`www.aliceinteligence.com`)"
      - "traefik.http.routers.alice-frontend-single-www-http.entrypoints=web"
      - "traefik.http.routers.alice-frontend-single-www-http.middlewares=redirect-to-https@docker"

      # HTTP Redirect to HTTPS - Double L
      - "traefik.http.routers.alice-frontend-double-http.rule=Host(`aliceintelligence.com`)"
      - "traefik.http.routers.alice-frontend-double-http.entrypoints=web"
      - "traefik.http.routers.alice-frontend-double-http.middlewares=redirect-to-https@docker"

      # HTTP Redirect to HTTPS - Double L WWW
      - "traefik.http.routers.alice-frontend-double-www-http.rule=Host(`www.aliceintelligence.com`)"
      - "traefik.http.routers.alice-frontend-double-www-http.entrypoints=web"
      - "traefik.http.routers.alice-frontend-double-www-http.middlewares=redirect-to-https@docker"

      # Definition of Global Redirect Middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
