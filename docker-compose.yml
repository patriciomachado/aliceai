version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    env_file: ./backend/.env
    depends_on:
      - redis
    restart: always
    labels:
      - "traefik.enable=true"
      # Router HTTPS (Secure)
      - "traefik.http.routers.alice-api.rule=(Host(`aliceintelligence.com`) || Host(`aliceinteligence.com`) || Host(`www.aliceinteligence.com`) || Host(`www.aliceintelligence.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api.entrypoints=websecure"
      - "traefik.http.routers.alice-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.alice-api.loadbalancer.server.port=3000"
      # Router HTTP (Redirect to HTTPS)
      - "traefik.http.routers.alice-api-http.rule=(Host(`aliceintelligence.com`) || Host(`aliceinteligence.com`) || Host(`www.aliceinteligence.com`) || Host(`www.aliceintelligence.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.alice-api-http.entrypoints=web"
      - "traefik.http.routers.alice-api-http.middlewares=redirect-to-https"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: always
    labels:
      - "traefik.enable=true"
      # Router HTTPS (Secure)
      - "traefik.http.routers.alice-frontend.rule=Host(`aliceintelligence.com`) || Host(`aliceinteligence.com`) || Host(`www.aliceinteligence.com`) || Host(`www.aliceintelligence.com`)"
      - "traefik.http.routers.alice-frontend.entrypoints=websecure"
      - "traefik.http.routers.alice-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.alice-frontend.loadbalancer.server.port=80"
      # Router HTTP (Redirect to HTTPS)
      - "traefik.http.routers.alice-frontend-http.rule=Host(`aliceintelligence.com`) || Host(`aliceinteligence.com`) || Host(`www.aliceinteligence.com`) || Host(`www.aliceintelligence.com`)"
      - "traefik.http.routers.alice-frontend-http.entrypoints=web"
      - "traefik.http.routers.alice-frontend-http.middlewares=redirect-to-https"
      # Definicao do Middleware de Redirecionamento
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
